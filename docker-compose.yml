services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tajurba
      POSTGRES_PASSWORD: tajurba
      POSTGRES_DB: tajurba
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tajurba -d tajurba"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your .env before starting}
      DATABASE_URL: postgresql+psycopg://tajurba:tajurba@db:5432/tajurba
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10/minute}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
